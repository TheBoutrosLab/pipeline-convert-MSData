---
input_csv:
  type: Path
  mode: r
  required: true
  help: Path to the input CSV file.
output_dir:
  type: Path
  mode: w
  required: true
  help: Output directory.
sample_id:
  type: String
  required: true
  help: Sample ID
ucla_cds:
  type: Bool
  required: false
  default: false
  help: Compatibility flag used by the shared work-directory setup. Keep false outside the legacy UCLA-CDS environment.
save_intermediate_files:
  type: Bool
  default: false
  help: Whether to save intermediate files. Defaults to `false`.
  required: false
convert_algorithm:
  type: String
  choices:
    - ProteoWizard
    - OpenMS
  default: ProteoWizard
  help: The algorithm used for conversion. Must be either 'OpenMS' or 'ProteoWizard'. Defaults to 'ProteoWizard'.
  required: false
peak_picking_vendor:
  type: Bool
  default: true
  help: Whether to use vendor peak picking.
peak_picking_openms:
  type: Bool
  default: false
  help: Whether to run `PeakPickerHiRes` from OpenMS.
pwiz_extra_args:
  type: String
  default: ' '
  help: Extra arguments to be passed to `MSConvert` (*e.g.* '--zlib', '--zlib --64 --inten64').
run_index:
  type: Bool
  default: true
  help: Whether to run the indexing step for the output file using OpenMS' `FileConverter` command to clean up and update file version.
output_format:
  type: String
  choices:
    - mzML
    - mzXML
    - mgf
    - mz5
    - ms1
    - cms1
    - ms2
    - cms2
    - cachedMzML
    - featureXML
    - consensusXML
    - edta
    - mzData
    - dta2d
    - csv
    - sqmass
  required: true
  help: Output mass-spectrometry data format.
work_dir:
  type: Path
  mode: w
  required: false
  help: Optional path for Nextflow intermediate files.
apptainer_library:
  type: Path
  mode: r
  required: false
  help: Absolute path to the Apptainer library directory.
apptainer_cache:
  type: Path
  mode: w
  required: false
  help: Absolute path to the Apptainer cache directory.
singularity_library:
  type: Path
  mode: r
  required: false
  help: Absolute path to the Singularity library directory.
singularity_cache:
  type: Path
  mode: w
  required: false
  help: Absolute path to the Singularity cache directory.
base_resource_update:
  type: ResourceUpdateNamespace
  required: false
  help: User-defined multipliers for adjusting process resource allocations.
  elements:
    memory:
      type: ResourceUpdateList
      required: false
      help: Memory allocation updates.
    cpus:
      type: ResourceUpdateList
      required: false
      help: CPU allocation updates.
